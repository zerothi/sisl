version: 2

submodules:
  include:
    - files

build:
  os: "ubuntu-lts-latest"
  apt_packages:
    - cmake
    - build-essential
    - gcc
    - gfortran
    - pandoc
  tools:
    python: "latest"
  jobs:
    pre_install:
      - ./.readthedocs-pre_install.sh
    # Overrides python.install: the config has no env-var key.
    # There is no need for an optimized build... Just do it quickly!
    # the docs group is moved to the pre-install.sh script
    install:
      - SKBUILD_CMAKE_BUILD_TYPE=Debug python -m pip install --upgrade-strategy only-if-needed --no-cache-dir .

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats: []
